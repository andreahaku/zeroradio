[Service]
# Run the cap init (RF switch + GNSS wake) before EVERY meshtasticd start —
# including plain restarts, where a separate oneshot dependency would not
# re-run and a GPS left in CASIC hardsleep would fail the baud autoprobe.
# The '+' prefix runs it with full privileges regardless of the service user.
ExecStartPre=+/usr/local/sbin/cap-lora-init
